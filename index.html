<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TreppenLesen</title>

    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">

    <meta name="theme-color" content="#4CAF50">
</head>

<body>

<div id="startScreen" class="screen active">

    <h1>📚 TreppenLesen</h1>

    <p>Bitte wähle eine Lernwortliste.</p>

    <select id="listSelect">
        <option value="alle">Alle Lernwörter</option>
        <option value="LW1">LW1</option>
        <option value="LW2">LW2</option>
        <option value="LW3">LW3</option>
        <option value="LW4">LW4</option>
        <option value="LW5">LW5</option>
        <option value="LW6">LW6</option>
        <option value="LW7">LW7</option>
        <option value="LW8">LW8</option>
        <option value="LW9">LW9</option>
        <option value="LW10">LW10</option>
        <option value="LW11">LW11</option>
        <option value="LW12">LW12</option>
        <option value="LW13">LW13</option>
        <option value="LW14">LW14</option>
        <option value="LW15">LW15</option>
        <option value="LW16">LW16</option>
        <option value="LW17">LW17</option>
    </select>

    <button id="startButton">
        ▶ Lernen starten
    </button>

</div>

<div id="learnScreen" class="screen">

    <header>

        <button id="homeButton">🏠</button>

        <h2 id="currentList"></h2>

        <div id="stars">0 ⭐</div>

    </header>

    <div id="stairs"></div>

    <div class="buttonRow">

        <button id="listenButton">
            🔊 Vorlesen
        </button>

        <button id="micButton">
            🎤 Lesen
        </button>

    </div>

    <div id="feedback"></div>

</div>

<script src="words.js"></script>
<script src="app.js"></script>

</body>
</html>
